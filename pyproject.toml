[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "clr-whatsapp-mcp"
version = "0.1.0"
description = "MCP server for WhatsApp messaging via Go bridge + Supabase"
authors = [{name = "Clearminds", email = "noc@clearminds.se"}]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.4.0",
    "pydantic-settings>=2.0.0",
    "httpx>=0.27.0",
    "segno>=1.6.0",  # render the WhatsApp pairing QR to a PNG (pure-python)
    "supabase>=2.0.0,<2.26.0",  # 2.26+ pulls pyiceberg/pyroaring (C++ build)
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.4.0",
]

[project.scripts]
clr-whatsapp-mcp = "clr_whatsapp_mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/clr_whatsapp_mcp"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["E501"]
