services:
  whatsapp-bridge:
    image: ghcr.io/clearminds/clr-whatsapp-bridge:latest
    ports:
      - "8080:8080"
    volumes:
      - bridge-data:/data
    environment:
      SUPABASE_URL: ${SUPABASE_URL}
      SUPABASE_KEY: ${SUPABASE_KEY}
      SUPABASE_DB_URL: ${SUPABASE_DB_URL}  # optional, for auto-migration
    restart: unless-stopped

volumes:
  bridge-data:
